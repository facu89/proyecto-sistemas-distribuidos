# Los secretos están en secrets/ (no se sube a git). La primera vez:
#   cp -r secrets.example secrets   y completar secrets/.env y secrets/usuarios.sql

services:
  emqx:
    image: emqx/emqx:5.8.6
    container_name: emqx
    restart: unless-stopped
    env_file: secrets/.env
    ports:
      - "1883:1883"
      - "8883:8883"   # MQTT sobre TLS
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - ./config/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      # Certificados TLS (las claves privadas no van a git, se generan localmente)
      - ./security/certs:/opt/emqx/etc/certs:ro
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    # MYSQL_ROOT_PASSWORD y MYSQL_PASSWORD vienen de secrets/.env
    env_file: secrets/.env
    environment:
      MYSQL_DATABASE: mqtt
      MYSQL_USER: emqx
    volumes:
      - mysql-data:/var/lib/mysql
      # Se ejecutan en orden alfabético y solo cuando el volumen está vacío
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./secrets/usuarios.sql:/docker-entrypoint-initdb.d/02-usuarios.sql:ro
    healthcheck:
      # $$ hace que la variable la resuelva el shell del contenedor, no compose
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      retries: 20

volumes:
  emqx-data:
  mysql-data:
