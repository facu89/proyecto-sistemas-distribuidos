# Los secretos están en secrets/ (no se sube a git). La primera vez:
#   cp -r secrets.example secrets   y completar secrets/.env
#
# Con "docker compose up -d" (o "podman compose up -d") se levanta todo, en este orden:
#   certs -> mysql -> emqx -> servicio
# No hace falta instalar nada más que Docker o Podman: los certificados y la web se generan en contenedores.

services:
  # Corre una vez en cada "up" y termina: deja listo el certificado TLS del broker en security/certs
  # (lo regenera solo si hace falta, ver security/preparar_certificados.sh). Usa BROKER_IP de secrets/.env.
  certs:
    build: ./security
    container_name: certs
    restart: "no"
    env_file: secrets/.env
    volumes:
      - ./security/certs:/security/certs:z

  emqx:
    image: emqx/emqx:5.10.5
    container_name: emqx
    restart: unless-stopped
    env_file: secrets/.env
    ports:
      - "1883:1883"
      - "8883:8883"   # Puerto TLS seguro
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      # ",z": en sistemas con SELinux (Fedora + Podman) etiqueta los archivos para que el
      # contenedor los pueda leer; sin eso da "Permission denied". En Docker sin SELinux no hace nada.
      - ./config/emqx.conf:/opt/emqx/etc/emqx.conf:ro,z
      - ./security/certs:/opt/emqx/etc/certs:ro,z
    depends_on:
      certs:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    # Para que el servicio arranque recién cuando EMQX está listo para aceptar conexiones
    healthcheck:
      test: ["CMD-SHELL", "emqx ctl status | grep -q 'is started'"]
      interval: 5s
      retries: 30

  # Servicio central (software/servicio): reglas de los actuadores y la web en http://localhost:8080.
  # La imagen compila también la web, por eso el contexto es la raíz del repo.
  servicio:
    build:
      context: ../..
      dockerfile: software/servicio/Dockerfile
    container_name: servicio
    restart: unless-stopped
    # Usuario y clave MQTT del servicio (MQTT_SERVICIO_USER y MQTT_SERVICIO_PASSWORD)
    env_file: secrets/.env
    environment:
      # Dentro de la red de compose el broker se llama "emqx" (el certificado incluye ese nombre)
      MQTT_URL: mqtts://emqx:8883
      MQTT_CA: /certs/ca.pem
      # Escucha en todas las interfaces del contenedor; el "ports" de abajo decide quién llega
      HTTP_HOST: 0.0.0.0
    ports:
      - "8080:8080"
    volumes:
      - ./security/certs:/certs:ro,z
    depends_on:
      emqx:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    # MYSQL_ROOT_PASSWORD y MYSQL_PASSWORD vienen de secrets/.env
    env_file: secrets/.env
    environment:
      MYSQL_DATABASE: mqtt
      MYSQL_USER: emqx
    volumes:
      - mysql-data:/var/lib/mysql
      # Se ejecutan en orden alfabético y solo cuando el volumen está vacío
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,z
      - ./mysql/02-init-users.sh:/docker-entrypoint-initdb.d/02-init-users.sh:ro,z
    healthcheck:
      # $$ hace que la variable la resuelva el shell del contenedor, no compose
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      retries: 20

volumes:
  emqx-data:
  mysql-data:
