<text x="35" y="42" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start">Arquitectura del sistema de bancales</text>
<text x="35" y="66" font-size="13" font-weight="400" fill="#5a6270" text-anchor="start">Todo lo que pasa entre los ESP32 y el servicio va por el broker. Ningún componente MQTT le habla directamente a otro.</text>
