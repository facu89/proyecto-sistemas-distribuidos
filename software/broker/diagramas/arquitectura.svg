<text x="44" y="179" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">ESP32 (uno por bancal)</text>
<text x="44" y="200" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">bancal1esp1, bancal2esp1…</text>
<text x="44" y="217" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">WiFi de la facultad:</text>
<text x="44" y="234" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">solo sale por 80 y 443</text>
<text x="44" y="251" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">certificado de cliente propio</text>
<text x="44" y="268" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">aplica las reglas con la</text>
<text x="44" y="285" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">configuración del servicio</text>
<text x="44" y="302" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">MQTT/TLS al :443</text>
