<text x="869" y="227" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">historial de lecturas</text>
<text x="869" y="244" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">modo y rangos por bancal</text>
