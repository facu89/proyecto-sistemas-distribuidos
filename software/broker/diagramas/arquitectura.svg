<text x="319" y="194" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Tailscale Funnel</text>
<text x="319" y="215" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">:443, el único público</text>
<text x="319" y="232" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">pasa el TCP sin descifrar</text>
<text x="319" y="249" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">→ 127.0.0.1:8884</text>
<text x="319" y="266" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">elige la máquina por SNI</text>
<rect x="305" y="460" width="180" height="125" rx="12" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="305" y="460" width="180" height="6" rx="3" fill="#6b7280"/>
<text x="319" y="489" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Tailscale Serve</text>
<text x="319" y="510" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">:8443, HTTPS</text>
<text x="319" y="527" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">solo red de Tailscale</text>
<text x="319" y="544" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">→ 127.0.0.1:8090</text>
<rect x="305" y="610" width="180" height="80" rx="12" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="305" y="610" width="180" height="6" rx="3" fill="#9aa1ab"/>
<text x="319" y="639" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">SSH</text>
<text x="319" y="660" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">túnel al panel de EMQX</text>
<text x="319" y="677" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">(127.0.0.1:18084)</text>
<rect x="540" y="160" width="270" height="160" rx="12" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="540" y="160" width="270" height="6" rx="3" fill="#2a56a5"/>
<text x="554" y="189" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start">EMQX 5.10 (broker)</text>
<text x="554" y="210" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">listener ssl :8883 con TLS mutuo</text>
<text x="554" y="227" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">usuario = CN del certificado</text>
<text x="554" y="244" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">auth: clave + client ID = usuario</text>
<text x="554" y="261" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">ACL contra MySQL (no_match = deny)</text>
<text x="554" y="278" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">reglas: alertas, historial, webhooks</text>
<rect x="855" y="160" width="160" height="120" rx="12" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="855" y="160" width="160" height="6" rx="3" fill="#6b7280"/>
