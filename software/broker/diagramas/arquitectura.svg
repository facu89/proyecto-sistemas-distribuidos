<text x="869" y="565" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">CA del proyecto,</text>
<text x="869" y="582" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">certificado del broker</text>
<text x="869" y="599" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">y de cada cliente</text>
