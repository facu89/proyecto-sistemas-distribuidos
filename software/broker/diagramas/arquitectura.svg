<rect width="1300" height="805" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start">Arquitectura del sistema de bancales</text>
<text x="30" y="63" font-size="13" font-weight="400" fill="#5a6270" text-anchor="start">Los ESP32 y el servicio solo se comunican por el broker. Desde internet, lo único que se alcanza es el puerto MQTT con TLS mutuo.</text>
<rect x="290" y="80" width="760" height="640" rx="16" fill="#fbfbfc" stroke="#9aa1ab" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="306" y="104" font-size="13" font-weight="700" fill="#4b5563" text-anchor="start">Servidor alumno16 (nodo de sd-2026) · sin puertos abiertos: todo en 127.0.0.1</text>
<rect x="510" y="122" width="525" height="586" rx="14" fill="#f3f5f8" stroke="#b4b9c2" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="526" y="680" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">Docker Compose: compose.yaml + compose.servidor.yaml</text>
<text x="526" y="697" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">volúmenes emqx-data y mysql-data · claves y certificados: archivos del host (no van a git)</text>
<rect x="305" y="165" width="180" height="125" rx="12" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
