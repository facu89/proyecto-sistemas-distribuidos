<text x="554" y="515" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">estado, modo y rangos de cada bancal</text>
<text x="554" y="532" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">publica órdenes y configuración</text>
<text x="554" y="549" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">web 3D + API :8080</text>
<text x="554" y="566" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="start">recibe el webhook directo</text>
