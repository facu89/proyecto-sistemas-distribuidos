<text x="35" y="42" font-size="22" font-weight="700" fill="#1f2328">ACL del broker: quién puede publicar y suscribirse a cada tópico</text>
<text x="35" y="66" font-size="13" fill="#5a6270">Reglas en MySQL (tabla mqtt_acl), evaluadas por EMQX en cada publish y subscribe. Lo que no figura se deniega (no_match = deny).</text>
