<text x="35" y="627" font-size="12.5" fill="#5a6270">${username}: EMQX lo reemplaza por el usuario con que se autenticó el cliente. Una sola regla sirve para todos los ESP32 y ninguno puede publicar</text>
<text x="35" y="645" font-size="12.5" fill="#5a6270">ni leer en los tópicos de otro nodo (bancal1esp1 no puede tocar bancal2esp1/…). El servicio es el único que publica órdenes y ningún cliente puede publicar alertas.</text>
