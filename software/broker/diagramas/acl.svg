<text x="35" y="627" font-size="12.5" fill="#5a6270">${username}: EMQX lo reemplaza por el usuario del cliente. Una sola regla sirve para todos los ESP32 y ninguno puede publicar ni leer en los tópicos de otro nodo.</text>
<text x="35" y="645" font-size="12.5" fill="#5a6270">El usuario sale del CN del certificado de cliente (TLS mutuo), la clave se verifica contra MySQL y el client ID tiene que ser igual al usuario: nadie entra como otro.</text>
<text x="35" y="663" font-size="12.5" fill="#5a6270">El servicio es el único que publica órdenes y configuración, y ningún cliente puede publicar alertas: las genera el broker.</text>
