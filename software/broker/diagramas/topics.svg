<text x="40" y="910" font-size="12.5" fill="#5a6270">Comodines: el servicio lee todos los nodos con + (+/sensor/+, +/actuador/+/estado, +/presencia, +/config/aplicada) y alertas/#.</text>
<text x="40" y="928" font-size="12.5" fill="#5a6270">Cada ESP32 solo usa los de su nodoId ({nodoId}/actuador/+/cmd, {nodoId}/config) y servicio/conexion, que es el mismo para todos.</text>
