node {
  data_dir = "data"
}

dashboard {
  listeners.http.bind = 18083
}

cluster {
  name = plantas
  discovery_strategy = manual
}

## Listeners sin cifrar apagados. EMQX trae por defecto MQTT en 1883, WebSocket en 8083 y WebSocket con
## TLS en 8084; ninguno se usa (el ESP32 y el servicio van por TLS en el 8883) y abiertos dejarían entrar
## clientes cuya clave viaja en texto plano.
listeners.tcp.default.enable = false
listeners.ws.default.enable = false
listeners.wss.default.enable = false

## Puerto seguro MQTT sobre TLS (puerto 8883)
listeners.ssl.default {
  bind = "8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.pem"
    certfile = "/opt/emqx/etc/certs/broker.pem"
    keyfile = "/opt/emqx/etc/certs/broker.key"
  }
}

## Autenticación por MySQL (¿Quién se conecta?)
authentication = [
  {
    mechanism = password_based
    backend = mysql
    server = "mysql:3306"
    database = "mqtt"
    username = "emqx"
    ## la clave viene de secrets/.env (EMQX_AUTHENTICATION__1__PASSWORD)
    query = "SELECT password_hash, salt, is_superuser FROM mqtt_user WHERE username = ${username} LIMIT 1"
    password_hash_algorithm { name = sha256, salt_position = prefix }
  }
]

## Autorización / ACLs basadas en MySQL (¿A qué tópicos puede acceder?)
authorization {
  ## Si no coincide con ninguna regla de la base de datos, se deniega la acción:
  no_match = deny
  deny_action = ignore

  sources = [
    {
      type = mysql
      server = "mysql:3306"
      database = "mqtt"
      username = "emqx"
      ## la clave viene de secrets/.env (EMQX_AUTHORIZATION__SOURCES__1__PASSWORD)
      query = "SELECT permission, action, topic FROM mqtt_acl WHERE username = ${username} OR username = '$all'"
    }
  ]
}

## Motor de reglas: lógica que se ejecuta dentro del broker con cada mensaje
rule_engine {
  rules {

    ## Alerta "nodo offline": se activa con el Last Will y se apaga cuando el nodo vuelve
    alerta_nodo_offline {
      description = "Publica en alertas/nodo_offline/{nodo} si el nodo está caído o no"
      sql = """
        SELECT
          nth(1, split(topic, '/')) AS nodo,
          payload = 'offline'       AS activa,
          timestamp
        FROM "+/presencia"
      """
      actions = [
        {
          function = republish
          args {
            topic   = "alertas/nodo_offline/${nodo}"
            qos     = 1
            retain  = true
            payload = """{"nodo": "${nodo}", "activa": ${activa}, "desde": ${timestamp}}"""
          }
        }
      ]
    }

    ## >>> [TELEGRAM 1/2] INICIO: regla que avisa por Telegram ------------------------------
    ## Escucha las alertas de la regla de arriba y, solo si el nodo se cayó (activa = true),
    ## usa la acción http:telegram (definida al final del archivo, en [TELEGRAM 2/2]).
    notificar_telegram {
      description = "Manda un mensaje de Telegram cuando un nodo se desconecta o se conecta"
      ## [SERVICIO] Ahora la regla arma el texto del mensaje (campo "texto"), porque la acción
      ## http:telegram pasó a ser genérica. concat() une dos textos; para tres, se anida.
      ##
      ## [CONEXION] Antes tenía "WHERE payload.activa = true" y solo avisaba las caídas.
      ## Se sacó el WHERE y un CASE elige el texto según el estado del nodo:
      ##   activa = true  (el broker publicó el Last Will "offline") -> "🔴 El nodo X se desconectó"
      ##   activa = false (el ESP32 publicó "online" al conectarse)  -> "🟢 El nodo X se conectó"
      ## Ojo: el ESP32 publica "online" cada vez que se conecta, así que también avisa cuando
      ## arranca por primera vez o cuando reconecta después de reiniciar el broker.
      sql = """
        SELECT
          payload.nodo AS nodo,
          CASE
            WHEN payload.activa = true
              THEN concat(concat('🔴 El nodo ', payload.nodo), ' se desconectó')
            ELSE concat(concat('🟢 El nodo ', payload.nodo), ' se conectó')
          END AS texto
        FROM "alertas/nodo_offline/+"
      """
      actions = ["http:telegram"]
    }
    ## <<< [TELEGRAM 1/2] FIN ---------------------------------------------------------------

    ## >>> [SERVICIO] INICIO: regla que vigila al servicio central ---------------------------
    ## El servicio (software/servicio) decide cuándo prender riego, luz y ventilador. Si se cae,
    ## nadie controla los actuadores y quedan como estaban. Esta regla avisa cuando eso pasa.
    ##
    ## No escucha un tópico sino EVENTOS DEL BROKER ($events/...): EMQX los genera solo cuando
    ## un cliente se conecta o se desconecta. Por eso el servicio no necesita Last Will ni cambios
    ## en su código. Una regla puede escuchar varios eventos a la vez (separados por coma).
    ##
    ## Qué calcula el SQL (los comentarios van acá afuera: dentro de """ ... """ serían parte del SQL):
    ##   event   -> 'client.disconnected' o 'client.connected'
    ##   reason  -> motivo técnico de la desconexión que da EMQX (en client.connected viene 'undefined')
    ##   activa  -> true si se cayó, false si volvió
    ##   motivo  -> el reason traducido para personas
    ##   texto   -> el mensaje de Telegram (lo envía la acción http:telegram). Usa "motivo": una columna
    ##              puede usar otra calculada antes en el mismo SELECT.
    ##   FROM    -> los dos eventos del broker, separados por coma
    ##   WHERE   -> solo el usuario MQTT del servicio (MQTT_SERVICIO_USER en secrets/.env)
    vigilar_servicio {
      description = "Avisa por Telegram y en alertas/servicio cuando el servicio central se cae o vuelve"
      sql = """
        SELECT
          event,
          reason,
          event = 'client.disconnected' AS activa,
          CASE
            WHEN event  = 'client.connected'  THEN 'volvió a conectarse'
            WHEN reason = 'normal'            THEN 'se detuvo'
            WHEN reason = 'keepalive_timeout' THEN 'dejó de responder'
            WHEN reason = 'tcp_closed'        THEN 'se cortó la conexión'
            WHEN reason = 'sock_closed'       THEN 'se cortó la conexión'
            WHEN reason = 'discarded'         THEN 'lo reemplazó otra copia del servicio'
            WHEN reason = 'takenover'         THEN 'lo reemplazó otra copia del servicio'
            ELSE reason
          END AS motivo,
          CASE
            WHEN event = 'client.disconnected'
              THEN concat(concat('⚠️ El servicio central se cayó (', motivo), '). Nadie controla los actuadores.')
            ELSE '✅ El servicio central volvió a conectarse.'
          END AS texto,
          timestamp
        FROM "$events/client_disconnected", "$events/client_connected"
        WHERE username = 'servicio'
      """
      actions = [
        ## 1) Deja el estado actual retenido en alertas/servicio (igual que las alertas de nodo)
        {
          function = republish
          args {
            topic   = "alertas/servicio"
            qos     = 1
            retain  = true
            payload = """{"activa": ${activa}, "motivo": "${motivo}", "desde": ${timestamp}}"""
          }
        },
        ## 2) Manda el aviso por Telegram con el campo "texto" de arriba
        "http:telegram"
      ]
    }
    ## <<< [SERVICIO] FIN ---------------------------------------------------------------------

    ## >>> [HISTORIAL 1/2] INICIO: guarda lecturas de sensores en MySQL ----------------------
    ## Con cada lectura (+/sensor/+) corre dos acciones sobre la tabla historial_lecturas
    ## (creada en mysql/init.sql). Las reglas no tienen temporizador, así que el "cada 10 minutos"
    ## y el "14 días" los chequea el propio SQL de cada acción al llegar un mensaje:
    ##   1) mysql:guardar_lectura -> inserta solo si ese sensor no tiene una fila en los últimos
    ##      10 minutos (con la tabla vacía, siempre inserta).
    ##   2) mysql:borrar_historial_viejo -> borra las filas de más de 14 días. Así siempre quedan
    ##      las dos últimas semanas (antes se vaciaba toda la tabla y el gráfico volvía a cero).
    ##
    ## Qué calcula el SQL:
    ##   nodo  -> primer nivel del tópico  (bancal1esp1/sensor/humedad -> bancal1esp1)
    ##   tipo  -> tercer nivel del tópico  (-> humedad)
    ##   valor -> el payload como número
    ##   WHERE -> descarta las lecturas fallidas, que el ESP32 publica como "nan"
    guardar_historial {
      description = "Guarda una lectura por sensor cada 10 minutos en historial_lecturas y borra las de más de 14 días"
      sql = """
        SELECT
          nth(1, split(topic, '/')) AS nodo,
          nth(3, split(topic, '/')) AS tipo,
          float(payload)            AS valor,
          timestamp
        FROM "+/sensor/+"
        WHERE payload != 'nan'
      """
      actions = ["mysql:guardar_lectura", "mysql:borrar_historial_viejo"]
    }
    ## <<< [HISTORIAL 1/2] FIN ----------------------------------------------------------------

  }
}

## >>> [HISTORIAL 2/2] INICIO: conector y acciones MySQL de la regla guardar_historial --------
## Conector: la misma base "mqtt" y el mismo usuario "emqx" que usa la autenticación.
## La clave viene de secrets/.env (EMQX_CONNECTORS__MYSQL__HISTORIAL__PASSWORD).
connectors {
  mysql {
    historial {
      server   = "mysql:3306"
      database = "mqtt"
      username = "emqx"
      password = ""
      pool_size = 4
    }
  }
}

## Acciones. ${...} se reemplaza por los campos del SELECT de la regla (EMQX los manda como
## parámetros de una sentencia preparada, así que no hay riesgo de inyección SQL).
## La hora sale del broker (timestamp, en milisegundos), no del reloj de MySQL.
## batch_size = 1: EMQX solo sabe juntar en lotes los INSERT ... VALUES. Estas sentencias no
## son de ese tipo, así que al arrancar puede dejar en el log un aviso de que no pudo
## "parsear" el SQL para lotes. Es esperable y no impide que funcionen.
actions {
  mysql {
    guardar_lectura {
      connector = historial
      parameters {
        ## INSERT ... SELECT ... WHERE NOT EXISTS: inserta solo si no hay una lectura de ese
        ## mismo sensor (nodo + tipo) en los 10 minutos anteriores.
        sql = """
          INSERT INTO historial_lecturas (nodo, tipo, valor, ts)
          SELECT ${nodo}, ${tipo}, ${valor}, FROM_UNIXTIME(${timestamp} / 1000)
          FROM DUAL
          WHERE NOT EXISTS (
            SELECT 1 FROM historial_lecturas
            WHERE nodo = ${nodo} AND tipo = ${tipo}
              AND ts > FROM_UNIXTIME(${timestamp} / 1000) - INTERVAL 10 MINUTE
          )
        """
      }
      resource_opts { batch_size = 1 }
    }

    borrar_historial_viejo {
      connector = historial
      parameters {
        ## Corre con cada lectura, pero casi siempre no encuentra nada: busca por el índice idx_ts
        ## (ts) solo las filas anteriores al límite, así que cuesta lo mismo con 10 que con 10.000
        ## filas. Cada 10 minutos, más o menos, borra las 5 lecturas que cumplieron 14 días.
        sql = """
          DELETE FROM historial_lecturas
          WHERE ts < FROM_UNIXTIME(${timestamp} / 1000) - INTERVAL 14 DAY
        """
      }
      resource_opts { batch_size = 1 }
    }
  }
}
## <<< [HISTORIAL 2/2] FIN --------------------------------------------------------------------

## >>> [TELEGRAM 2/2] INICIO: webhook a Telegram (conector + acción) -------------------------
## Conector: a qué servidor se conecta EMQX.
connectors {
  http {
    telegram {
      url = "https://api.telegram.org"
      headers { "content-type" = "application/json" }
    }
  }
}

## Acción: qué pedido le hace a ese servidor. La usan las reglas notificar_telegram y vigilar_servicio
## ("http:telegram").
actions {
  http {
    telegram {
      connector = telegram
      parameters {
        method = post
        ## El token y el chat_id son secretos: el valor real viene de secrets/.env
        ## (EMQX_ACTIONS__HTTP__TELEGRAM__PARAMETERS__PATH). Sin esa variable, Telegram rechaza el pedido.
        path = "/bot-sin-configurar/sendMessage"
        ## [SERVICIO] El texto lo arma cada regla en un campo "texto" de su SELECT; la acción solo lo envía.
        ## Así la misma acción sirve para cualquier aviso. Antes el texto estaba fijo acá
        ## ("🔴 El nodo ${nodo} se desconectó") y solo servía para nodos caídos.
        ## Ojo: el texto no puede tener comillas dobles ni saltos de línea (rompería el JSON).
        body = """{"text": "${texto}"}"""
      }
    }
  }
}
## <<< [TELEGRAM 2/2] FIN -------------------------------------------------------------------
