node {
  data_dir = "data"
}

dashboard {
  listeners.http.bind = 18083
}

cluster {
  name = plantas
  discovery_strategy = manual
}

## Puerto seguro MQTT sobre TLS
listeners.ssl.default {
  bind = "8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.pem"
    certfile = "/opt/emqx/etc/certs/broker.pem"
    keyfile = "/opt/emqx/etc/certs/broker.key"
  }
}

## Autenticación por MySQL
authentication = [
  {
    mechanism = password_based
    backend = mysql
    server = "mysql:3306"
    database = "mqtt"
    username = "emqx"
    query = "SELECT password_hash, salt, is_superuser FROM mqtt_user WHERE username = ${username} LIMIT 1"
    password_hash_algorithm { name = sha256, salt_position = prefix }
  }
]

## Autorización / ACLs basadas en MySQL
authorization {
  sources = [
    {
      type = mysql
      server = "mysql:3306"
      database = "mqtt"
      username = "emqx"
      password = "${env.MYSQL_EMQX_PASSWORD}"
      query = "SELECT permission, action, topic FROM mqtt_acl WHERE username = ${username}"
    }
  ]
}