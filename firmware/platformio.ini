; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
; Certificados TLS: la CA del broker (para verificarlo) y el certificado y la clave de este ESP32 (TLS
; mutuo). scripts/copiar_certificados.py los copia desde software/broker/security/certs/ antes de compilar;
; red.cpp los lee como _binary_certs_ca_pem_start, _binary_certs_cliente_pem_start y _binary_certs_cliente_key_start.
extra_scripts = pre:scripts/copiar_certificados.py
board_build.embed_txtfiles =
    certs/ca.pem
    certs/cliente.pem
    certs/cliente.key
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.1
